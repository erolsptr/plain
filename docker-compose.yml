version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg17
    container_name: plain_postgres_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=2233
      - POSTGRES_DB=plain_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: